<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>影视搜索</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>
:root{
  --bg:#0b0b0f;
  --bg-elev:#16161d;
  --bg-card:#1c1c24;
  --line:#2a2a33;
  --text:#f2f2f5;
  --muted:#9a9aa8;
  --orange:#ff6a2a;
  --orange-2:#ff8a4a;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;min-height:100%}
a{color:inherit}
button,input{font-family:inherit}
img{max-width:100%;display:block}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#3a3a45;border-radius:8px}

.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:12px 20px;background:rgba(11,11,15,.92);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;letter-spacing:.5px;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--orange),#ff3d00);display:grid;place-items:center}
.searchbox{flex:1;min-width:240px;display:flex;background:#111118;border:1px solid var(--line);border-radius:24px;overflow:hidden}
.searchbox input{flex:1;background:transparent;border:0;outline:0;color:var(--text);padding:10px 16px;font-size:14px}
.searchbox button{border:0;background:var(--orange);color:#fff;padding:0 18px;font-weight:700;cursor:pointer}
.source-btn{border:1px solid var(--line);background:var(--bg-elev);color:var(--text);border-radius:20px;padding:8px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:6px;position:relative}
.source-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:180px;background:var(--bg-card);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;z-index:50;max-height:360px;overflow:auto}
.source-menu.show{display:block}
.source-menu div{padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.source-menu div.on,.source-menu div:hover{background:#2a211c;color:#fff}

.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 80px}
.row-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.row-head h2{font-size:18px;font-weight:800}
.week-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.week-tabs::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;background:#22222b;color:var(--text);border-radius:18px;padding:7px 14px;font-size:13px;cursor:pointer}
.chip.on{background:var(--orange);color:#fff;font-weight:700}
.chip .today{margin-left:4px;font-size:10px;opacity:.9}

.hscroll{display:flex;gap:12px;overflow-x:auto;padding:4px 2px 14px;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}
.hscroll::-webkit-scrollbar{height:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:16px}

.card{cursor:pointer;min-width:148px;max-width:180px;scroll-snap-align:start}
.grid .card{max-width:none}
.poster{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:#222}
.poster img{width:100%;height:100%;object-fit:cover}
.poster .mark{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px}
.poster .src{position:absolute;right:8px;top:8px;background:var(--orange);color:#fff;font-size:10px;padding:2px 6px;border-radius:4px}
.card .name{margin-top:8px;font-size:14px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sub{margin-top:3px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{text-align:center;color:var(--muted);padding:48px 12px}
.empty button{margin-top:14px;border:0;background:var(--orange);color:#fff;border-radius:20px;padding:10px 22px;cursor:pointer;font-weight:700}
.skel{background:linear-gradient(90deg,#1a1a22 25%,#25252f 50%,#1a1a22 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);background:#2b2b34;color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.2s;z-index:80;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

.player{
  position:fixed;inset:0;z-index:70;background:#050507;display:none;flex-direction:column;
}
.player.show{display:flex}
.p-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.p-title{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.p-close{width:36px;height:36px;border:0;border-radius:50%;background:#222;color:#fff;cursor:pointer;font-size:20px}
.p-body{flex:1;min-height:0;display:grid;grid-template-columns:1fr 320px}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;background:#000}
.stage video{width:100%;height:100%;max-height:calc(100vh - 52px);background:#000;outline:0}
.side{min-height:0;display:flex;flex-direction:column;background:var(--bg-elev);border-left:1px solid var(--line)}
.side-top{padding:12px 14px 8px;flex-shrink:0}
.routes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.route{border:1px solid var(--line);background:#111;color:var(--muted);border-radius:14px;padding:5px 10px;font-size:12px;cursor:pointer}
.route.on{border-color:var(--orange);color:#fff;background:#2a1a12}
.ep-tools{display:flex;gap:8px;align-items:center}
.ep-tools button{flex:1;border:1px solid var(--line);background:#111;color:#fff;border-radius:8px;padding:8px 0;cursor:pointer}
.ep-tools button:disabled{opacity:.35;cursor:default}
.ep-info{font-size:12px;color:var(--muted);margin-top:8px}
.ep-scroll{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 20px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ep{border:1px solid var(--line);background:#121218;color:var(--text);border-radius:8px;padding:10px 4px;font-size:12px;cursor:pointer;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ep.on{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700}
.hint{padding:0 14px 14px;font-size:12px;color:var(--muted);flex-shrink:0}

.ext{display:none;flex:1;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--muted);padding:24px}
.ext.show{display:flex}
.ext a,.ext button{background:var(--orange);color:#fff;border:0;border-radius:20px;padding:10px 20px;text-decoration:none;cursor:pointer;font-weight:700}

@media(max-width:900px){
  .p-body{grid-template-columns:1fr;grid-template-rows:auto minmax(220px,42vh)}
  .stage video{max-height:42vh;aspect-ratio:16/9;height:auto}
  .side{border-left:0;border-top:1px solid var(--line)}
  .ep-grid{grid-template-columns:repeat(5,1fr)}
  .card{min-width:128px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
}
@media(max-width:560px){
  .ep-grid{grid-template-columns:repeat(4,1fr)}
  .topbar{padding:10px 12px}
  .wrap{padding:12px 12px 72px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="logo"><i>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>
  </i>影视搜索</div>
  <div class="searchbox">
    <input id="q" placeholder="搜索国漫，如仙逆、凡人修仙传" autocomplete="off">
    <button id="go">搜索</button>
  </div>
  <button class="source-btn" id="srcBtn">全部片源 ▾
    <div class="source-menu" id="srcMenu"></div>
  </button>
</header>

<main class="wrap">
  <section id="homeSec">
    <div class="row-head"><h2>国漫更新</h2></div>
    <div class="week-tabs" id="weekTabs"></div>
    <div class="hscroll" id="weekRow"></div>
    <div class="row-head" style="margin-top:18px"><h2>热门国漫</h2></div>
    <div class="grid" id="hotGrid"></div>
  </section>
  <section id="resultSec" style="display:none">
    <div class="row-head"><h2 id="resultTitle">搜索结果</h2><button class="chip" id="backHome">返回首页</button></div>
    <div class="grid" id="resultGrid"></div>
  </section>
</main>

<div class="player" id="player">
  <div class="p-head">
    <div class="p-title" id="pTitle">播放</div>
    <button class="p-close" id="pClose">×</button>
  </div>
  <div class="p-body">
    <div class="stage">
      <video id="video" controls playsinline></video>
      <div class="ext" id="extBox">
        <div>该内容暂无直链，可前往页面查看</div>
        <button id="extBtn">打开页面</button>
      </div>
    </div>
    <aside class="side">
      <div class="side-top">
        <div class="routes" id="routes"></div>
        <div class="ep-tools">
          <button id="prevEp">上一集</button>
          <button id="nextEp">下一集</button>
        </div>
        <div class="ep-info" id="epInfo">选集</div>
      </div>
      <div class="ep-scroll" id="epScroll">
        <div class="ep-grid" id="epGrid"></div>
      </div>
      <div class="hint" id="hint"></div>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const DAYS = ['周一','周二','周三','周四','周五','周六','周日'];
let sources = [];
let sourceId = '';
let weekData = {};
let hotData = [];
let weekDay = -1;
let hls = null;
let routes = [];
let routeIdx = 0;
let eps = [];
let epIdx = 0;

const $ = id => document.getElementById(id);
const toast = (m) => { const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); };
function todayIdx(){ const d=new Date().getDay(); return d===0?6:d-1; }
function imgUrl(u){ if(!u) return ''; return '/api/img?url=' + encodeURIComponent(u); }
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function api(path){
  const r = await fetch(path, { cache:'no-store' });
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}

function cardHtml(item){
  return `<article class="card" data-item="${esc(encodeURIComponent(JSON.stringify(item)))}">
    <div class="poster">
      ${item.vod_pic ? `<img src="${esc(imgUrl(item.vod_pic))}" loading="lazy" onerror="this.style.opacity=0">` : ''}
      <span class="mark">${esc(item.vod_remarks || item.vod_year || '')}</span>
      <span class="src">${esc(item.source_name || '')}</span>
    </div>
    <div class="name" title="${esc(item.vod_name)}">${esc(item.vod_name)}</div>
    <div class="sub">${esc([item.vod_year, item.type_name].filter(Boolean).join(' · '))}</div>
  </article>`;
}

function bindCards(root){
  root.querySelectorAll('.card').forEach(el => {
    el.onclick = () => {
      try { openItem(JSON.parse(decodeURIComponent(el.dataset.item))); } catch(e){ toast('打开失败'); }
    };
  });
}

function skeleton(n){
  return Array.from({length:n}, () => `<div class="card"><div class="poster skel"></div><div class="name skel" style="height:14px"></div></div>`).join('');
}

function renderWeek(){
  const row = $('weekRow');
  let list = [];
  if(weekDay === -1){
    for(let i=1;i<=7;i++) list = list.concat(weekData[i] || weekData[String(i)] || []);
  }else{
    list = weekData[weekDay+1] || weekData[String(weekDay+1)] || [];
  }
  if(!list.length){
    row.innerHTML = '<div class="empty" style="width:100%">这一天暂无更新</div>';
    return;
  }
  row.innerHTML = list.slice(0, 40).map(cardHtml).join('');
  bindCards(row);
}

function renderHot(){
  const g = $('hotGrid');
  if(!hotData.length){
    g.innerHTML = '<div class="empty" style="grid-column:1/-1">暂无热番<button id="reloadHome">重新加载</button></div>';
    const b=$('reloadHome'); if(b) b.onclick=loadHome;
    return;
  }
  g.innerHTML = hotData.slice(0, 24).map(cardHtml).join('');
  bindCards(g);
}

function initWeekTabs(){
  const t = $('weekTabs');
  const today = todayIdx();
  const tabs = [{i:-1,l:'全部'}].concat(DAYS.map((l,i)=>({i,l})));
  t.innerHTML = tabs.map(x => `<button class="chip${x.i===weekDay?' on':''}" data-d="${x.i}">${x.l}${x.i===today?' <span class="today">今天</span>':''}</button>`).join('');
  t.querySelectorAll('.chip').forEach(btn => btn.onclick = () => {
    weekDay = Number(btn.dataset.d);
    t.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', b===btn));
    renderWeek();
  });
}

async function loadSources(){
  try{
    const d = await api('/api/sources');
    sources = d.list || [];
  }catch(e){ sources = []; }
  const menu = $('srcMenu');
  menu.innerHTML = `<div class="on" data-id="">全部片源</div>` + sources.map(s => `<div data-id="${esc(s.id)}">${esc(s.name)}</div>`).join('');
  menu.querySelectorAll('div').forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    sourceId = el.dataset.id;
    menu.querySelectorAll('div').forEach(x => x.classList.toggle('on', x===el));
    $('srcBtn').firstChild.textContent = (el.textContent || '全部片源') + ' ▾';
    menu.classList.remove('show');
  });
}

async function loadHome(){
  $('weekRow').innerHTML = skeleton(8);
  $('hotGrid').innerHTML = skeleton(12);
  try{
    const d = await api('/api/home');
    weekData = d.week || {};
    hotData = d.hot || [];
    if(!hotData.length){
      const names = [];
      Object.values(weekData).forEach(arr => (arr||[]).forEach(it => names.push(it)));
      hotData = names.slice(0, 24);
    }
    renderWeek();
    renderHot();
  }catch(e){
    $('weekRow').innerHTML = '<div class="empty" style="width:100%">周表加载失败<button id="reloadW">重试</button></div>';
    $('hotGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">热番加载失败<button id="reloadH">重试</button></div>';
    const a=$('reloadW'), b=$('reloadH');
    if(a) a.onclick=loadHome; if(b) b.onclick=loadHome;
  }
}

async function doSearch(){
  const wd = $('q').value.trim();
  if(!wd){ toast('输入片名再搜'); return; }
  $('homeSec').style.display='none';
  $('resultSec').style.display='block';
  $('resultTitle').textContent = '搜索：' + wd;
  $('resultGrid').innerHTML = skeleton(12);
  try{
    const d = await api('/api/search?wd=' + encodeURIComponent(wd) + (sourceId ? '&source=' + encodeURIComponent(sourceId) : ''));
    const list = d.list || [];
    if(!list.length){
      $('resultGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">没有找到相关内容</div>';
      return;
    }
    $('resultGrid').innerHTML = list.slice(0, 60).map(cardHtml).join('');
    bindCards($('resultGrid'));
  }catch(e){
    $('resultGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">搜索失败，请稍后重试</div>';
  }
}

function parseRoutes(playUrl, playFrom){
  if(!playUrl) return [];
  const groups = String(playUrl).split('$$$');
  const names = playFrom ? String(playFrom).split('$$$') : [];
  const out = [];
  groups.forEach((g, gi) => {
    const eps = [];
    g.split('#').forEach((part, idx) => {
      const bits = part.split('$');
      let name, url;
      if(bits.length>=2){ name=bits[0].trim(); url=bits[1].trim(); }
      else { url=bits[0].trim(); name='第'+String(idx+1).padStart(2,'0')+'集'; }
      if(url) eps.push({name: name || ('第'+(idx+1)+'集'), url});
    });
    if(eps.length) out.push({ name: (names[gi]||'').trim() || ('线路'+(gi+1)), episodes: eps });
  });
  return out;
}

async function openItem(item){
  $('player').classList.add('show');
  document.body.style.overflow='hidden';
  $('pTitle').textContent = item.vod_name || '播放';
  $('extBox').classList.remove('show');
  $('video').style.display='block';
  stopVideo();
  routes=[]; eps=[]; epIdx=0; routeIdx=0;
  renderRoutes(); renderEps();
  $('hint').textContent = '正在获取播放地址…';

  let detail = item;
  if(item.source_id && item.source_id !== 'age' && item.source_id !== 'bangumi' && !item.vod_play_url){
    try{
      const d = await api('/api/detail?source=' + encodeURIComponent(item.source_id) + '&id=' + encodeURIComponent(item.vod_id));
      if(d.item) detail = d.item;
    }catch(e){}
  }
  if(!detail.vod_play_url){
    try{
      const d = await api('/api/search?wd=' + encodeURIComponent(item.vod_name));
      const hit = (d.list||[]).find(x => x.vod_play_url) || (d.list||[])[0];
      if(hit){
        if(!hit.vod_play_url && hit.source_id){
          const dd = await api('/api/detail?source=' + encodeURIComponent(hit.source_id) + '&id=' + encodeURIComponent(hit.vod_id));
          if(dd.item) detail = dd.item;
        } else detail = hit;
      }
    }catch(e){}
  }

  routes = parseRoutes(detail.vod_play_url, detail.vod_play_from);
  if(!routes.length){
    $('hint').textContent = '暂无直链播放地址';
    $('extBox').classList.add('show');
    $('video').style.display='none';
    $('extBtn').onclick = () => window.open(item.bgm_url || ('https://www.baidu.com/s?wd=' + encodeURIComponent(item.vod_name)), '_blank');
    return;
  }
  $('extBox').classList.remove('show');
  $('video').style.display='block';
  renderRoutes();
  switchRoute(0);
}

function renderRoutes(){
  const box = $('routes');
  if(routes.length<=1){ box.innerHTML=''; return; }
  box.innerHTML = routes.map((r,i)=>`<button class="route${i===routeIdx?' on':''}" data-i="${i}">${esc(r.name)}</button>`).join('');
  box.querySelectorAll('.route').forEach(b => b.onclick = () => switchRoute(Number(b.dataset.i)));
}

function switchRoute(i){
  routeIdx = i;
  eps = routes[i] ? routes[i].episodes : [];
  renderRoutes();
  renderEps();
  playEp(0);
}

function renderEps(){
  $('epGrid').innerHTML = eps.map((e,i)=>`<button class="ep${i===epIdx?' on':''}" data-i="${i}">${esc(e.name)}</button>`).join('');
  $('epGrid').querySelectorAll('.ep').forEach(b => b.onclick = () => playEp(Number(b.dataset.i)));
  $('epInfo').textContent = eps.length ? (`第 ${epIdx+1} / ${eps.length} 集`) : '暂无选集';
  $('prevEp').disabled = epIdx<=0;
  $('nextEp').disabled = epIdx>=eps.length-1;
}

function stopVideo(){
  const v=$('video');
  v.pause(); v.removeAttribute('src'); v.load();
  if(hls){ hls.destroy(); hls=null; }
}

function playEp(i){
  if(!eps[i]) return;
  epIdx = i;
  renderEps();
  const url = eps[i].url;
  const v = $('video');
  stopVideo();
  $('hint').textContent = '正在播放 ' + eps[i].name;
  const btn = $('epGrid').querySelector('.ep.on');
  if(btn) btn.scrollIntoView({block:'nearest', inline:'nearest'});
  if(url.indexOf('.m3u8')!==-1){
    if(window.Hls && Hls.isSupported()){
      hls = new Hls({maxBufferLength:30, enableWorker:true});
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
      hls.on(Hls.Events.ERROR, (_, data) => { if(data.fatal) $('hint').textContent='播放出错，试试其他集或线路'; });
    }else if(v.canPlayType('application/vnd.apple.mpegurl')){
      v.src=url; v.play().catch(()=>{});
    }else $('hint').textContent='当前浏览器不支持 m3u8';
  }else{
    v.src=url; v.play().catch(()=>{});
  }
}

function closePlayer(){
  $('player').classList.remove('show');
  document.body.style.overflow='';
  stopVideo();
}

$('go').onclick = doSearch;
$('q').addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
$('backHome').onclick = () => { $('resultSec').style.display='none'; $('homeSec').style.display='block'; };
$('srcBtn').onclick = (e) => { e.stopPropagation(); $('srcMenu').classList.toggle('show'); };
document.addEventListener('click', () => $('srcMenu').classList.remove('show'));
$('pClose').onclick = closePlayer;
$('prevEp').onclick = () => { if(epIdx>0) playEp(epIdx-1); };
$('nextEp').onclick = () => { if(epIdx<eps.length-1) playEp(epIdx+1); };
$('video').addEventListener('ended', () => { if(epIdx<eps.length-1) playEp(epIdx+1); });
document.addEventListener('keydown', e => {
  if(!$('player').classList.contains('show')) return;
  if(e.key==='Escape') closePlayer();
  if(e.key==='ArrowLeft' && epIdx>0) playEp(epIdx-1);
  if(e.key==='ArrowRight' && epIdx<eps.length-1) playEp(epIdx+1);
});

weekDay = -1;
initWeekTabs();
loadSources();
loadHome();
</script>
